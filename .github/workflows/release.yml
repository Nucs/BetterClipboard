# Pushing a tag v<semver> builds, tests and publishes a GitHub release with:
#   BetterClipboard-<version>-win-x64.zip, BetterClipboard-<version>-win-arm64.zip  (self-contained)
#   BetterClipboard-<version>-win-x64.7z, BetterClipboard-<version>-win-arm64.7z    (the same files, LZMA2)
#   SHA256SUMS.txt                                                               (install.ps1 verifies it)
#   install.ps1                                                                  (the installer itself)
#   betterclipboard.<version>.nupkg                                              (Chocolatey, stable only)
# Release notes are the annotated tag's message (git tag -a v1.2.3 -F notes.md), followed by a link to the README's
# "Code signing policy": SignPath Foundation's terms ask for that term on every download/release page (docs/code-signing.md).
#
# Chocolatey (stable versions only: the Community Repository refuses SemVer 2 prereleases such as 1.0.0-rc.1):
# the package embeds the two .7z archives and is installed, upgraded and uninstalled for real on this runner
# before anything is published; it is pushed after the GitHub release exists, because its VERIFICATION.txt
# points moderators at that release's assets. The push needs the CHOCOLATEY_API_KEY secret (the API key of the
# community.chocolatey.org account); without it the package is only attached to the release. A package-only fix for an
# already released version is chocolatey.yml's job (run by hand). See docs/chocolatey.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags. The pushed tag itself still arrives lightweight: see "Release notes from the tag".
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not v<semver>." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Before the long test and package steps, so a tag without notes fails in seconds.
      # actions/checkout@v5 fetches a pushed tag by its commit (+<sha>:refs/tags/<tag>), which leaves a lightweight tag
      # in this clone: the annotation is gone, and gh's --notes-from-tag then quietly used the commit's message. Every
      # release up to v0.2.3 was published that way ("Version 0.2.3" instead of its notes). checkout fixed it in v6
      # (actions/checkout#2356); fetching the tag object again works with any version, and a tag that is still not
      # annotated is refused instead of published with the wrong text.
      - name: Release notes from the tag
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          git fetch --force --quiet origin "+refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw "Fetching the tag object of '$tag' failed ($LASTEXITCODE)." }
          if ((git cat-file -t "refs/tags/$tag") -ne 'tag') { throw "Tag '$tag' is not annotated: release notes are the annotated tag's message (git tag -a $tag -F notes.md)." }

          # The notes --notes-from-tag takes (the tag's whole message, its signature stripped, as gh does it), plus a
          # footer linking the README's code signing policy, which SignPath Foundation's terms ask every download and
          # release page to name (docs/code-signing.md).
          # git writes the message as UTF-8, but PowerShell decodes a native command's output with the console's code
          # page (an OEM one on Windows runners), which would garble every em dash and arrow of the notes; gh read the
          # bytes itself and never had that problem.
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $message = (git tag --list $tag '--format=%(contents)') -join "`n"
          $signature = (git tag --list $tag '--format=%(contents:signature)') -join "`n"
          if ($signature -and $message.EndsWith($signature)) { $message = $message.Substring(0, $message.Length - $signature.Length) }
          $message = $message.Trim()
          if (-not $message) { throw "Tag '$tag' has an empty message: release notes are the annotated tag's message (git tag -a $tag -F notes.md)." }
          $footer = '**Code signing policy:** see [the README](https://github.com/Nucs/BetterClipboard#code-signing-policy) for whether this release is signed, what is signed, and who approves it.'
          # RUNNER_TEMP, not artifacts/: the package scripts own that folder.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, "$message`n`n---`n`n$footer`n", [Text.UTF8Encoding]::new($false))
          "file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution BetterClipboard.sln -c Release

      - name: Package
        shell: pwsh
        run: tools/release/package.ps1 -Version ${{ steps.version.outputs.version }} -OutputDirectory artifacts/release

      # The app's update button runs this release's own install.ps1 with a fixed command line (-Update -Package ...).
      # A release whose installer no longer accepts it could not be installed by any earlier version, so the exact zip
      # that is published below is updated to once here, in scratch folders (tools/release/test-update.ps1).
      - name: Update mode of the installer (x64)
        shell: pwsh
        run: tools/release/test-update.ps1 -Version ${{ steps.version.outputs.version }} -Architecture x64 -PackageDirectory artifacts/release

      # The exact .nupkg that is pushed below, tested by a real install/upgrade/uninstall on this disposable runner
      # (Chocolatey's own verifier cannot: its Windows Server 2019 is older than the app's minimum).
      - name: Chocolatey package
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        shell: pwsh
        run: |
          tools/release/package-chocolatey.ps1 -Version ${{ steps.version.outputs.version }} -ArtifactsDirectory artifacts/release
          tools/release/test-chocolatey.ps1 -Version ${{ steps.version.outputs.version }} -PackageDirectory artifacts/release
          if ($LASTEXITCODE -ne 0) { throw "The package test failed (exit code $LASTEXITCODE); the failed checks are marked FAIL above." }
          # The link the first review's verifier exemption request needs (docs/chocolatey.md section 5).
          "betterclipboard ${{ steps.version.outputs.version }} was installed, upgraded with the app running and uninstalled on windows-latest in this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem artifacts/release/*.zip, artifacts/release/*.7z, artifacts/release/*.nupkg | ForEach-Object FullName) + @('artifacts/release/SHA256SUMS.txt', 'install.ps1')
          $prerelease = if ($version -match '-') { '--prerelease' } else { $null }
          gh release create $tag @assets --title "BetterClipboard $version" --notes-file '${{ steps.notes.outputs.file }}' --verify-tag $prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }

      - name: Push to Chocolatey
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = 'artifacts/release/betterclipboard.${{ steps.version.outputs.version }}.nupkg'
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Warning "No CHOCOLATEY_API_KEY secret: $package was attached to the release but not pushed. Push it with: choco push <file> --source https://push.chocolatey.org/ --api-key <key>"
            exit 0
          }
          choco push $package --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "choco push failed ($LASTEXITCODE)." }
