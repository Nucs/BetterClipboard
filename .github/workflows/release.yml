# Pushing a tag v<semver> builds, tests and publishes a GitHub release with:
#   BetterClipboard-<version>-win-x64.zip, BetterClipboard-<version>-win-arm64.zip  (self-contained)
#   SHA256SUMS.txt                                                               (install.ps1 verifies it)
#   install.ps1                                                                  (the installer itself)
# Release notes are the annotated tag's message (git tag -a v1.2.3 -F notes.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The annotated tag object (for --notes-from-tag) is not fetched by the default shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not v<semver>." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution BetterClipboard.sln -c Release

      - name: Package
        shell: pwsh
        run: tools/release/package.ps1 -Version ${{ steps.version.outputs.version }} -OutputDirectory artifacts/release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assets = @(Get-ChildItem artifacts/release/*.zip | ForEach-Object FullName) + @('artifacts/release/SHA256SUMS.txt', 'install.ps1')
          $prerelease = if ($version -match '-') { '--prerelease' } else { $null }
          gh release create '${{ github.ref_name }}' @assets --title "BetterClipboard $version" --notes-from-tag --verify-tag $prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
