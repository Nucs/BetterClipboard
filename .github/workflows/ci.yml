# Build + full test suite on every push to main and every pull request.
# The clipboard capture tests run inside a private window station (see
# tests/BetterClipboard.Windows.Tests/IsolatedClipboard.cs), so they need no interactive desktop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build BetterClipboard.sln -c Release --nologo

      - name: Test
        run: dotnet test --solution BetterClipboard.sln -c Release --no-build

      - name: Package smoke test (x64)
        shell: pwsh
        run: tools/release/package.ps1 -Version 0.0.0-ci -Architectures x64 -OutputDirectory artifacts/ci

      # install.ps1's update mode, run with the command line the app's update button uses, in scratch folders
      # (tools/release/test-update.ps1): every installed BetterClipboard depends on later installers accepting it.
      - name: Update mode of the installer (x64)
        shell: pwsh
        run: tools/release/test-update.ps1 -Version 0.0.0-ci -Architecture x64 -PackageDirectory artifacts/ci

      # The README's install command pipes install.ps1 into Invoke-Expression, which checks every validation attribute
      # of its param block against an empty value (tools/release/test-iex.ps1): one [ValidatePattern] broke it in 0.2.6-0.2.8.
      - name: Installer survives irm | iex
        shell: pwsh
        run: tools/release/test-iex.ps1

      # The Chocolatey package built from that x64 smoke test, installed, upgraded and uninstalled for real on this
      # disposable runner (tools/release/test-chocolatey.ps1), so a packaging regression shows before a release. The
      # second run asks for the "Start with Windows" entry for every user (/AllUsersStartup), which an install as SYSTEM
      # or by another account writes by itself.
      - name: Chocolatey package smoke test (x64)
        shell: pwsh
        run: |
          tools/release/package-chocolatey.ps1 -Version 0.0.0-ci -Architectures x64 -ArtifactsDirectory artifacts/ci
          tools/release/test-chocolatey.ps1 -Version 0.0.0-ci -Architectures x64 -PackageDirectory artifacts/ci
          # A script's "exit 1" only sets the exit code and lets the next line run: stop on it here.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/release/test-chocolatey.ps1 -Version 0.0.0-ci -Architectures x64 -PackageDirectory artifacts/ci -AllUsersStartup

      # install.ps1's install for every user, for real on this disposable runner: with -AllUsers as the signed-in
      # administrator, and as SYSTEM (a scheduled task), which must pick it by itself (tools/release/test-all-users.ps1).
      - name: Installer for every user (x64)
        shell: pwsh
        run: tools/release/test-all-users.ps1 -Version 0.0.0-ci -Architecture x64 -PackageDirectory artifacts/ci
